<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SCE - Cinematic Visual Editor</title>
    <style>
        :root { --bg: #1a1a1a; --panel: #252525; --text: #d4d4d4; --accent: #e67e22; --border: #333; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        #sidebar { width: 300px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .list-header { padding: 15px; background: #111; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .config-section { padding: 15px; background: #1d1d1d; border-bottom: 1px solid var(--border); }
        #sequence-list { flex: 1; overflow-y: auto; }
        .seq-item { padding: 12px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 13px; transition: 0.2s; }
        .seq-item:hover { background: #333; }
        .seq-item.active { border-left: 4px solid var(--accent); background: #333; font-weight: bold; }
        
        /* Main View */
        #main { flex: 1; display: flex; flex-direction: column; }
        #toolbar { padding: 10px; background: #111; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
        #canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; }
        canvas { background: #0a0a0a; box-shadow: 0 0 30px rgba(0,0,0,0.8); }

        /* Inspector */
        #inspector { width: 340px; background: var(--panel); border-left: 1px solid var(--border); padding: 15px; overflow-y: auto; font-size: 13px; }
        .prop-group { margin-bottom: 15px; background: #2d2d2d; padding: 10px; border-radius: 4px; }
        label { display: block; font-size: 11px; color: #888; margin-bottom: 4px; text-transform: uppercase; }
        input, select, textarea { width: 100%; background: #111; border: 1px solid #444; color: #fff; padding: 6px; border-radius: 3px; box-sizing: border-box; }
        
        /* Buttons */
        button { background: #444; border: none; color: white; padding: 7px 14px; border-radius: 3px; cursor: pointer; font-size: 12px; }
        button:hover { background: #555; }
        .btn-primary { background: var(--accent); }
        .btn-success { background: #27ae60; }
        
        .layer-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 10px 0; }
        .layer-btn { padding: 6px; text-align: center; background: #111; border: 1px solid #444; cursor: pointer; font-size: 11px; }
        .layer-btn.active { border-color: var(--accent); color: var(--accent); font-weight: bold; }
        
        #status { font-family: monospace; font-size: 12px; color: #aaa; margin-left: 10px; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="list-header">
        <span>SÉQUENCES</span>
        <button onclick="addSequence()" class="btn-primary" title="Ajouter une séquence">+</button>
    </div>

    <div class="config-section">
        <label>Cinématique (Dossier Images)</label>
        <input type="text" id="project-name" placeholder="Ex: Prologue_40K" value="New_Cinematic">
        <p style="font-size: 10px; color: #666; margin-top: 5px;">
            Chemin : img/cinematics/<span id="path-preview">New_Cinematic</span>/
        </p>
    </div>

    <div id="sequence-list">
        </div>

    <div style="padding:15px; background:#111; border-top: 1px solid var(--border);">
        <button onclick="document.getElementById('importFile').click()" style="width:100%; margin-bottom: 8px;">📂 Importer JSON</button>
        <input type="file" id="importFile" hidden accept=".json" onchange="importJSON(this)">
        <button onclick="exportJSON()" class="btn-success" style="width:100%">💾 Exporter JSON</button>
    </div>
</div>

<div id="main">
    <div id="toolbar">
        <button onclick="togglePlay()" class="btn-primary">Pause / Reprise</button>
        <button onclick="restartSeq()">Restart Step</button>
        
        <span style="color: #444;">|</span>
        
        <button onclick="startPlayAll()" style="background: #8e44ad;">▶ Play All</button>
        <button onclick="resetAll()" style="background: #c0392b;">☢ Reset All</button>
        
        <span id="status">IDLE</span>
        <div style="flex: 1;"></div>
        <div style="font-size: 11px; color: #888; padding-right: 10px;">SCE Engine v1.1.3 Preview</div>
    </div>
    
    <div id="canvas-wrap">
        <canvas id="view" width="1280" height="720"></canvas>
    </div>
</div>

<div id="inspector">
    <div id="ins-content">
        <h3>Propriétés</h3>
        <p style="color: #666;">Sélectionnez une séquence pour commencer l'édition.</p>
    </div>
</div>
<script src="js/CineEdit.js"></script>
<script>
    // Petit script utilitaire pour mettre à jour l'affichage du chemin en temps réel
    const nameInput = document.getElementById('project-name');
    const pathPreview = document.getElementById('path-preview');
    nameInput.addEventListener('input', () => {
        pathPreview.textContent = nameInput.value || "...";
    });
</script>

</body>
</html>
